# Demo application, deployed from the upstream podinfo Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  finalizers:
    # Delete the app's Kubernetes resources when the Application is removed.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.15.0
    helm:
      valuesObject:
        # Updated by the podinfo CI pipeline on every build (see TarikAZIKI/podinfo).
        image:
          repository: ghcr.io/tarikaziki/podinfo
          tag: sha-15cc2a1
        replicaCount: 2
        # Let Prometheus scrape /metrics (ServiceMonitor CRD from kube-prometheus-stack).
        serviceMonitor:
          enabled: true
        ingress:
          enabled: true
          className: traefik
          hosts:
            # No host: the public IP changes every session, so the app is
            # served on any hostname (http://<public-ip>/).
            - host: ""
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
