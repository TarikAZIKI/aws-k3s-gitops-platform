# Demo application, deployed from the upstream podinfo Helm chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  finalizers:
    # Delete the app's Kubernetes resources when the Application is removed.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.15.0
    helm:
      valuesObject:
        # Updated by the podinfo CI pipeline on every build (see TarikAZIKI/podinfo).
        image:
          repository: ghcr.io/stefanprodan/podinfo
          tag: 6.15.0
        replicaCount: 2
        ingress:
          enabled: true
          className: traefik
          hosts:
            # No host: the public IP changes every session, so the app is
            # served on any hostname (http://<public-ip>/).
            - host: ""
              paths:
                - path: /
                  pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
