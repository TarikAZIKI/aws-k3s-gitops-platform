apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: podinfo-alerts
  namespace: monitoring
spec:
  groups:
    - name: podinfo
      rules:
        - alert: PodinfoDown
          # Fires when no podinfo pod has been successfully scraped for 1 minute.
          expr: sum(up{namespace="podinfo", service="podinfo"}) == 0 or absent(up{namespace="podinfo", service="podinfo"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: podinfo is down
            description: No podinfo pod has answered Prometheus for more than 1 minute.
        - alert: PodinfoHighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="podinfo", status=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{namespace="podinfo"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: podinfo error rate above 5%
            description: More than 5% of podinfo requests returned a 5xx status over the last 5 minutes.
