[defaults]
inventory = inventory.ini
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/devops-platform
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml
retry_files_enabled = False

[ssh_connection]
# The instance (and therefore its SSH host key) is recreated every session:
# host keys are not recorded, to avoid a key conflict after every `make up`.
ssh_args = -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
