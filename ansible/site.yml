---
# Prepares the EC2 instance created by Terraform, installs k3s and bootstraps Argo CD.
# Run by `make configure` (the inventory is generated from Terraform outputs).

- name: Wait for the instance to be reachable
  hosts: k3s
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: Prepare the server, install k3s and Argo CD
  hosts: k3s
  become: true
  roles:
    - common
    - hardening
    - k3s
    - argocd
