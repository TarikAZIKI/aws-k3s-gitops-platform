---
- name: Download the k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/src/k3s-install.sh
    mode: "0755"

- name: Install k3s (single-node server)
  ansible.builtin.command:
    cmd: /usr/local/src/k3s-install.sh
    # Skip the install when k3s is already present: keeps the task idempotent.
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"
    # --tls-san: the API certificate must be valid for the public IP,
    # otherwise kubectl refuses to connect from the local machine.
    INSTALL_K3S_EXEC: >-
      server
      --tls-san {{ ansible_host }}
      --write-kubeconfig-mode 0600

- name: Wait for the node to be Ready
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Read the kubeconfig generated by k3s
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig

- name: Create the local ~/.kube directory
  ansible.builtin.file:
    path: "{{ k3s_local_kubeconfig | expanduser | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write the local kubeconfig, pointing to the public IP
  ansible.builtin.copy:
    dest: "{{ k3s_local_kubeconfig | expanduser }}"
    content: "{{ k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ ansible_host ~ ':6443') }}"
    mode: "0600"
  delegate_to: localhost
  become: false
